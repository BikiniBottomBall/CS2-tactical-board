<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 3D 战术板 - Dust2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; }

  /* ===== 暗色毛玻璃 UI ===== */
  .glass-panel {
    position: fixed;
    background: rgba(16, 22, 32, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    color: #dfe6ee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  #panel-top {
    top: 16px; left: 16px;
    padding: 14px 18px;
    min-width: 220px;
  }
  #panel-top h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #f0f4f8;
  }
  #panel-top h1 span { color: #ffa940; } /* CS 橙 */
  #panel-top .subtitle {
    margin-top: 4px;
    font-size: 11px;
    color: #8b98a8;
  }
  #panel-top .step-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 20px;
    background: rgba(255, 169, 64, 0.15);
    border: 1px solid rgba(255, 169, 64, 0.35);
    color: #ffa940;
  }

  #panel-help {
    bottom: 16px; left: 16px;
    padding: 10px 14px;
    font-size: 11px;
    line-height: 1.8;
    color: #8b98a8;
  }
  #panel-help b { color: #c8d2dd; font-weight: 600; }

  /* ===== 角色选择面板 ===== */
  #panel-role {
    top: 16px; right: 16px;
    padding: 14px 16px;
    width: 200px;
    transition: opacity 0.15s, transform 0.15s;
  }
  #panel-role.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
  }
  #role-title {
    font-size: 14px;
    font-weight: 600;
    color: #f0f4f8;
    margin-bottom: 2px;
  }
  #role-team {
    font-size: 11px;
    margin-bottom: 12px;
  }
  #role-team.t { color: #ff7a3d; }
  #role-team.ct { color: #5aa9ff; }
  .role-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .role-btns button {
    padding: 8px 0;
    font-size: 12px;
    font-family: inherit;
    color: #c8d2dd;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .role-btns button:hover { background: rgba(255, 255, 255, 0.14); }
  .role-btns button.active {
    color: #0d1219;
    font-weight: 600;
    background: var(--role-color, #ffa940);
    border-color: var(--role-color, #ffa940);
  }

  /* ===== 道具列表面板 ===== */
  #panel-utils {
    top: 158px; left: 16px;
    width: 232px;
    max-height: calc(100vh - 260px);
    overflow-y: auto;
    padding: 12px 14px;
  }
  #panel-utils::-webkit-scrollbar { width: 6px; }
  #panel-utils::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .util-group {
    font-size: 11px;
    color: #8b98a8;
    margin: 10px 0 6px;
    letter-spacing: 1px;
  }
  .util-group:first-child { margin-top: 0; }
  .util-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12px;
    color: #c8d2dd;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .util-item:hover { background: rgba(255, 255, 255, 0.08); }
  .util-item.active {
    background: rgba(255, 169, 64, 0.12);
    border-color: rgba(255, 169, 64, 0.4);
    color: #f0f4f8;
  }
  .util-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #btn-play-throw {
    width: 100%;
    margin-top: 12px;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: #0d1219;
    background: #ffa940;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #btn-play-throw:hover:not(:disabled) { background: #ffb85c; }
  #btn-play-throw:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ===== 战术方案区（顶部面板内） ===== */
  .plan-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .plan-label { font-size: 11px; color: #8b98a8; margin-bottom: 6px; letter-spacing: 1px; }
  #sel-plan {
    width: 100%;
    padding: 7px 8px;
    font-size: 12px;
    font-family: inherit;
    color: #dfe6ee;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    outline: none;
    cursor: pointer;
  }
  #sel-plan option { background: #101620; }
  .plan-btns { display: flex; gap: 6px; margin-top: 8px; }
  .plan-btns button {
    flex: 1;
    padding: 6px 0;
    font-size: 11px;
    font-family: inherit;
    color: #c8d2dd;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .plan-btns button:hover { background: rgba(255, 255, 255, 0.14); }

  /* ===== 底部时间轴 ===== */
  #panel-timeline {
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
  }
  .phase-tabs { display: flex; gap: 6px; }
  .phase-tabs button {
    padding: 8px 16px;
    font-size: 12px;
    font-family: inherit;
    color: #8b98a8;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .phase-tabs button:hover { color: #dfe6ee; background: rgba(255, 255, 255, 0.08); }
  .phase-tabs button.active {
    color: #ffa940;
    border-color: rgba(255, 169, 64, 0.5);
    background: rgba(255, 169, 64, 0.12);
  }
  #btn-play-tactic {
    padding: 8px 22px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: #0d1219;
    background: #ffa940;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #btn-play-tactic:hover { background: #ffb85c; }

  /* ===== 俯视截图模式（?shot=1 时隐藏全部 UI 与队员/标签） ===== */
  body.shot .glass-panel { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel-top" class="glass-panel">
  <h1>CS2 <span>3D 战术板</span></h1>
  <div class="subtitle">DUST2 · 战术演示工具</div>
  <div class="step-badge">STEP 5 · 战术时间轴</div>
  <div class="plan-section">
    <div class="plan-label">战术方案</div>
    <select id="sel-plan">
      <option value="custom">我的布置（自定义）</option>
      <option value="a-long">A 大强攻</option>
      <option value="mid-b">中路夹 B</option>
      <option value="default">默认控图</option>
    </select>
    <div class="plan-btns">
      <button id="btn-save">保存</button>
      <button id="btn-export">导出</button>
      <button id="btn-import">导入</button>
      <input type="file" id="file-import" accept=".json" hidden>
    </div>
  </div>
</div>

<div id="panel-timeline" class="glass-panel">
  <div class="phase-tabs">
    <button data-phase="0" class="active">① 准备</button>
    <button data-phase="1">② 推进</button>
    <button data-phase="2">③ 爆弹</button>
    <button data-phase="3">④ 残局</button>
  </div>
  <button id="btn-play-tactic">▶ 播放</button>
</div>

<div id="panel-utils" class="glass-panel">
  <div id="util-list"></div>
  <button id="btn-play-throw" disabled>▶ 播放投掷</button>
</div>

<div id="panel-role" class="glass-panel hidden">
  <div id="role-title">-</div>
  <div id="role-team">-</div>
  <div class="role-btns">
    <button data-role="entry">突破</button>
    <button data-role="awp">狙击</button>
    <button data-role="support">支援</button>
    <button data-role="igl">指挥</button>
  </div>
</div>

<div id="panel-help" class="glass-panel">
  <b>左键拖动</b> 旋转视角 · <b>右键拖动</b> 平移 · <b>滚轮</b> 缩放<br>
  <b>点击小人</b> 选择并设置角色 · <b>按住小人拖动</b> 摆放位置<br>
  <b>左侧列表</b> 选择道具显示轨迹 · <b>▶</b> 播放投掷动画<br>
  <b>底部时间轴</b> 切换战术阶段 · <b>▶ 播放</b> 自动演示
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 * 全局常量：地图尺寸（Dust2 简化俯视布局，单位 ≈ 米）
 * 后续步骤的地图几何体、道具、队员都基于这套坐标
 * ============================================================ */
export const MAP = {
  SIZE: 120,    // 雷达图为正方形：世界坐标 x/z 均 -60..+60，北朝上(-z)
  GROUND_COLOR: 0xb59a6a,  // Dust2 沙漠黄
};

let scene, camera, renderer, controls;
const walkables = [];  // 可行走表面（地面 + 平台），拖拽队员时射线检测用
const players = [];    // 全部队员

/* ------------------------------------------------------------
 * 初始化：渲染器 / 场景 / 相机 / 灯光 / 地面 / 控制器
 * ---------------------------------------------------------- */
function init() {
  // --- 渲染器 ---
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.getElementById('app').appendChild(renderer.domElement);

  // --- 场景：暗色天空 + 雾，突出战术板氛围 ---
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1219);
  scene.fog = new THREE.Fog(0x0d1219, 200, 420);

  // --- 相机 ---
  camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(0, 90, 110); // 斜上方俯视全局

  createLights();
  createGround();
  createMap();
  createPlayers();
  initInteraction();
  initUtils();
  initTactics();

  // --- 轨道控制器 ---
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.1;  // 不允许钻到地面以下
  controls.minDistance = 15;
  controls.maxDistance = 300;
  controls.target.set(0, 0, 0);

  window.addEventListener('resize', onResize);
}

/* ------------------------------------------------------------
 * 灯光：环境光 + 半球光 + 主平行光（投影）
 * ---------------------------------------------------------- */
function createLights() {
  const ambient = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(ambient);

  // 半球光：天空冷色 / 地面暖色，模拟沙漠环境反弹光
  const hemi = new THREE.HemisphereLight(0x9db8d9, 0x8a6f4d, 0.5);
  scene.add(hemi);

  // 主光源：斜射，产生柔和阴影
  const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
  sun.position.set(60, 100, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  sun.shadow.camera.far = 300;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
}

/* ------------------------------------------------------------
 * 地面：沙漠色平面 + 战术网格线
 * ---------------------------------------------------------- */
function createGround() {
  // 基底沙地（比雷达底图略大一圈）
  const groundGeo = new THREE.PlaneGeometry(MAP.SIZE * 1.6, MAP.SIZE * 1.6);
  const groundMat = new THREE.MeshStandardMaterial({
    color: MAP.GROUND_COLOR,
    roughness: 0.95,
    metalness: 0.0,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.name = 'ground';
  scene.add(ground);

  // 官方雷达俯视图作为底图（布局的唯一依据，墙体与其一一对应）
  const radarTex = new THREE.TextureLoader().load('沙2整体地图.png');
  radarTex.colorSpace = THREE.SRGBColorSpace;
  radarTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const radar = new THREE.Mesh(
    new THREE.PlaneGeometry(MAP.SIZE, MAP.SIZE),
    new THREE.MeshBasicMaterial({ map: radarTex }) // 不受光照影响，保证雷达配色可读
  );
  radar.rotation.x = -Math.PI / 2;
  radar.position.y = 0.02;
  radar.name = 'radar';
  scene.add(radar);
  walkables.push(radar);

  // 地图边界线
  const borderGeo = new THREE.PlaneGeometry(MAP.SIZE, MAP.SIZE);
  const borderEdges = new THREE.EdgesGeometry(borderGeo);
  const border = new THREE.LineSegments(
    borderEdges,
    new THREE.LineBasicMaterial({ color: 0xffa940, transparent: true, opacity: 0.6 })
  );
  border.rotation.x = -Math.PI / 2;
  border.position.y = 0.05;
  scene.add(border);
}

/* ------------------------------------------------------------
 * Dust2 地图：以官方雷达俯视图为唯一布局依据
 * 世界坐标：x/z 均 -60..+60，对应雷达图左->右 / 上->下，北朝上(-z)
 * 关键锚点（雷达 -> 世界）：
 *   B 点(-41,-43)  A 点(34,-43)  警家(13,-37)  匪家(-13,49)
 *   中路 x -10..2（中门 z -17）  A大 x 36..56  B洞/隧道 x -54..-36
 * ---------------------------------------------------------- */
const WALL_COLOR = 0x5d4c33; // 深棕墙体，与浅色平台区分（对应雷达黑色区域）
const CRATE_COLOR = 0x8f6f3f;

function createMap() {
  const map = new THREE.Group();
  map.name = 'dust2-map';

  // ---- 平台（抬高 0.8，对应雷达四个区域）----
  walkables.push(addBox(map, -13, 49, 26, 14, 0.8, 0x8a6f4d));   // 匪家 T（下方偏左）
  walkables.push(addBox(map, 13, -37, 18, 16, 0.8, 0x7a8398));  // 警家 CT（A 点后方）
  walkables.push(addBox(map, 34, -43, 32, 24, 0.8, 0xc4a878));  // A 点（含斜坡）
  walkables.push(addBox(map, -41, -43, 30, 30, 0.8, 0xc4a878)); // B 点

  // ---- 墙体（覆盖雷达黑色区域，通道走向与连接关系一一对应）----
  // 中门门框（横在中路 z -17，留门缝 x -7..-1）
  addBox(map, -8.5, -17, 3, 2, 8, WALL_COLOR);
  addBox(map, 0.5, -17, 3, 2, 8, WALL_COLOR);
  // 主要黑色体块
  addBox(map, -32, -22, 12, 12, 8, WALL_COLOR);  // B门南 — 白车死点北
  addBox(map, 28, -15, 12, 10, 8, WALL_COLOR);   // A小 — 蓝箱之间
  addBox(map, 13, 0, 14, 20, 8, WALL_COLOR);     // 中路东 — A门内西 大块
  addBox(map, 10, 29, 14, 10, 8, WALL_COLOR);    // 暗道 — 黄车之间
  addBox(map, -17, 12, 14, 28, 8, WALL_COLOR);   // B1南 — 中路西
  addBox(map, -31, 7, 14, 18, 8, WALL_COLOR);    // 后花园 — B通之间
  addBox(map, 43, 40, 34, 40, 8, WALL_COLOR);    // 东南角外（A大南端封死）
  // 边界墙
  addBox(map, 0, -59, 120, 2, 8, WALL_COLOR);    // 北
  addBox(map, 0, 59, 120, 2, 8, WALL_COLOR);     // 南
  addBox(map, -59, 0, 2, 120, 8, WALL_COLOR);    // 西
  addBox(map, 59, 0, 2, 120, 8, WALL_COLOR);     // 东

  // ---- 标志物 / 掩体箱 ----
  addBox(map, -48, -44, 3, 3, 2.5, CRATE_COLOR, 0.8);   // B 点高箱
  addBox(map, -36, -38, 2.5, 2.5, 2.2, CRATE_COLOR, 0.8); // B 点矮箱
  addBox(map, 36, -40, 2.5, 2.5, 2.2, CRATE_COLOR, 0.8);  // A 点一箱
  addBox(map, 39, -40, 2.5, 2.5, 2.2, CRATE_COLOR, 0.8);  // A 点二箱
  addBox(map, 44, -50, 3, 2, 1.5, WALL_COLOR, 0.8);       // A 点沙袋
  addBox(map, 26, -6, 2.5, 2.5, 2.5, CRATE_COLOR);        // 蓝箱
  addBox(map, -4, -10, 2.2, 2.2, 2, CRATE_COLOR);         // 叉箱（中路）
  addBox(map, -20, -12, 2.5, 2.5, 2, CRATE_COLOR);        // 白车（B1）

  // ---- 区域文字标签 ----
  addLabel(map, 'A', 34, 13, -43, '#ffa940');
  addLabel(map, 'B', -41, 13, -43, '#ffa940');
  addLabel(map, 'T', -13, 9, 49, '#ff7a3d');
  addLabel(map, 'CT', 13, 9, -37, '#5aa9ff');
  addLabel(map, '中路', -4, 10, 4, '#c8d2dd', 40);
  addLabel(map, 'A小', 8, 10, -14, '#c8d2dd', 40);
  addLabel(map, 'A大', 46, 10, -4, '#c8d2dd', 40);
  addLabel(map, 'B洞', -46, 10, 2, '#c8d2dd', 40);

  scene.add(map);
}

/* 通用方块：中心 (x, z)，宽 w 深 d 高 h，yBase 为底部抬升高度 */
function addBox(parent, x, z, w, d, h, color, yBase = 0) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.0 })
  );
  mesh.position.set(x, yBase + h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

/* 悬浮文字标签（Canvas 精灵，始终面向相机、不被遮挡） */
function addLabel(parent, text, x, y, z, cssColor = '#ffffff', fontSize = 72) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = `bold ${fontSize}px "Segoe UI", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = cssColor;
  ctx.fillText(text, 128, 64);

  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false })
  );
  sprite.scale.set(14, 7, 1);
  sprite.position.set(x, y, z);
  parent.add(sprite);
  return sprite;
}

/* ------------------------------------------------------------
 * 队员：T 方橙色 × 5 / CT 方蓝色 × 5，可拖拽，可选角色
 * ---------------------------------------------------------- */
const ROLES = {
  entry:   { name: '突破', color: 0xff5252, css: '#ff5252' },
  awp:     { name: '狙击', color: 0xb388ff, css: '#b388ff' },
  support: { name: '支援', color: 0x69f0ae, css: '#69f0ae' },
  igl:     { name: '指挥', color: 0xffd740, css: '#ffd740' },
};
const TEAM_COLOR = { T: 0xff7a3d, CT: 0x5aa9ff };
const DEFAULT_ROLES = ['entry', 'entry', 'awp', 'support', 'igl'];

const playersGroup = new THREE.Group();
let selectedPlayer = null;

function createPlayers() {
  playersGroup.name = 'players';
  scene.add(playersGroup);

  const tSpots  = [[-18, 46], [-10, 46], [-4, 50], [-14, 52], [-6, 44]];
  const ctSpots = [[8, -34], [14, -34], [18, -38], [10, -41], [16, -41]];

  tSpots.forEach((p, i)  => spawnPlayer(`T${i + 1}`, 'T', DEFAULT_ROLES[i], p[0], p[1], 0.8));
  ctSpots.forEach((p, i) => spawnPlayer(`CT${i + 1}`, 'CT', DEFAULT_ROLES[i], p[0], p[1], 0.8));
}

function spawnPlayer(id, team, role, x, z, y) {
  const group = new THREE.Group();
  const color = TEAM_COLOR[team];

  // 身体（胶囊）
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.6, 1.2, 4, 12),
    new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
  );
  body.position.y = 1.3;
  body.castShadow = true;
  group.add(body);

  // 头
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xe8e0d0, roughness: 0.5 })
  );
  head.position.y = 2.55;
  head.castShadow = true;
  group.add(head);

  // 角色指示环（贴在脚下）
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.9, 1.2, 32),
    new THREE.MeshBasicMaterial({ color: ROLES[role].color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.06;
  group.add(ring);

  group.position.set(x, y, z);
  group.userData.playerId = id;
  playersGroup.add(group);

  const player = { id, team, role, group, ring, labelCanvas: null, labelTex: null };
  createPlayerLabel(player);
  players.push(player);
  return player;
}

/* 头顶标签：名字 · 角色 */
function createPlayerLabel(player) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 80;
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false })
  );
  sprite.scale.set(7, 2.2, 1);
  sprite.position.y = 3.6;
  player.group.add(sprite);
  player.labelCanvas = canvas;
  player.labelTex = texture;
  redrawPlayerLabel(player);
}

function redrawPlayerLabel(player) {
  const ctx = player.labelCanvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 80);
  ctx.font = 'bold 34px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = player.team === 'T' ? '#ffb080' : '#9cc8ff';
  ctx.fillText(`${player.id} · ${ROLES[player.role].name}`, 128, 40);
  player.labelTex.needsUpdate = true;
}

/* 设置角色：更新指示环颜色 + 头顶标签 */
function setRole(player, role) {
  player.role = role;
  player.ring.material.color.setHex(ROLES[role].color);
  redrawPlayerLabel(player);
  if (selectedPlayer === player) refreshRolePanel();
}

/* ------------------------------------------------------------
 * 交互：点击选择 / 拖拽移动 / 角色面板
 * ---------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let dragPlayer = null;
let dragMoved = false;

function initInteraction() {
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  document.querySelectorAll('#panel-role .role-btns button').forEach(btn => {
    btn.style.setProperty('--role-color', ROLES[btn.dataset.role].css);
    btn.addEventListener('click', () => {
      if (selectedPlayer) setRole(selectedPlayer, btn.dataset.role);
    });
  });
}

function setPointer(event) {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

/* 从鼠标位置拾取队员（沿父链找到带 playerId 的根节点） */
function pickPlayer(event) {
  setPointer(event);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(playersGroup.children, true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !obj.userData.playerId) obj = obj.parent;
  return players.find(p => p.id === obj.userData.playerId) || null;
}

function onPointerDown(event) {
  if (event.button !== 0) return;
  const player = pickPlayer(event);
  if (player) {
    dragPlayer = player;
    dragMoved = false;
    controls.enabled = false; // 拖拽队员时暂停视角控制
  } else {
    selectPlayer(null); // 点空白处取消选中
  }
}

function onPointerMove(event) {
  if (!dragPlayer) return;
  setPointer(event);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(walkables, false);
  if (hits.length) {
    const pt = hits[0].point;
    dragPlayer.group.position.set(pt.x, pt.y, pt.z);
    dragMoved = true;
  }
}

function onPointerUp() {
  if (!dragPlayer) return;
  controls.enabled = true;
  if (!dragMoved) selectPlayer(dragPlayer); // 未移动视为点击 -> 选中
  dragPlayer = null;
}

function selectPlayer(player) {
  if (selectedPlayer) selectedPlayer.ring.scale.setScalar(1);
  selectedPlayer = player;
  const panel = document.getElementById('panel-role');
  if (player) {
    player.ring.scale.setScalar(1.3); // 选中高亮
    refreshRolePanel();
    panel.classList.remove('hidden');
  } else {
    panel.classList.add('hidden');
  }
}

function refreshRolePanel() {
  const p = selectedPlayer;
  document.getElementById('role-title').textContent = p.id;
  const teamEl = document.getElementById('role-team');
  teamEl.textContent = p.team === 'T' ? 'T 方 · 进攻' : 'CT 方 · 防守';
  teamEl.className = p.team.toLowerCase();
  document.querySelectorAll('#panel-role .role-btns button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.role === p.role);
  });
}

/* ------------------------------------------------------------
 * 道具投掷：10 个 Dust2 经典道具，抛物线轨迹 + 播放动画
 * ---------------------------------------------------------- */
const UTIL_TYPES = {
  smoke:   { name: '烟雾弹', color: 0x9aa5ad, css: '#9aa5ad' },
  flash:   { name: '闪光弹', color: 0xffe082, css: '#ffe082' },

/* from/to 基于地图坐标系；airBurst 表示闪光弹空爆高度 */
const UTILITIES = [
  { id: 1,  name: '中路凹槽烟', type: 'smoke',   from: [-10, 44],  to: [2, -26] },
  { id: 2,  name: '中门烟',    type: 'smoke',   from: [-12, 42],  to: [-4, -17] },
  { id: 3,  name: 'A大过点烟', type: 'smoke',   from: [24, 22],   to: [44, -26] },
  { id: 4,  name: 'A点警家烟', type: 'smoke',   from: [44, -14],  to: [24, -34] },
  { id: 5,  name: 'B洞出口烟', type: 'smoke',   from: [-46, 2],   to: [-38, -26] },
  { id: 8,  name: '中路高闪',  type: 'flash',   from: [-4, 8],    to: [-4, -17], airBurst: 6 },
  { id: 9,  name: 'A大闪',     type: 'flash',   from: [26, 20],   to: [48, -8],  airBurst: 5 },
  { id: 10, name: 'B洞瞬爆闪', type: 'flash',   from: [-46, 8],   to: [-42, -32], airBurst: 6 },
  { id: 6,  name: 'B点车位火', type: 'molotov', from: [-36, -24], to: [-48, -40] },
  { id: 7,  name: 'A点鹅位火', type: 'molotov', from: [8, -14],   to: [44, -50] },
];

const trajectoryGroup = new THREE.Group();
const effectsGroup = new THREE.Group();
let currentUtility = null;
let activeThrow = null;    // { curve, mesh, life, duration, utility }
const activeEffects = [];  // { objects, life, duration, update(life) }
let landingRing = null;    // 当前落点圆环（脉冲动画用）

function initUtils() {
  scene.add(trajectoryGroup);
  scene.add(effectsGroup);
  buildUtilList();
  document.getElementById('btn-play-throw').addEventListener('click', playThrow);
}

/* 左侧道具列表：按 烟/闪/火 分组 */
function buildUtilList() {
  const listEl = document.getElementById('util-list');
  ['smoke', 'flash', 'molotov'].forEach(type => {
    const header = document.createElement('div');
    header.className = 'util-group';
    header.textContent = `—— ${UTIL_TYPES[type].name} ——`;
    listEl.appendChild(header);

      item.addEventListener('click', () => selectUtility(u.id));

    });

}

function selectUtility(id) {
  currentUtility = UTILITIES.find(u => u.id === id);
  document.querySelectorAll('.util-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
  document.getElementById('btn-play-throw').disabled = false;
  showUtility(currentUtility);
}

/* 抛物线：出手高度 2，顶点高度随距离增加，闪光弹可空爆 */
function getThrowCurve(u) {
  const start = new THREE.Vector3(u.from[0], 2, u.from[1]);
  const end = new THREE.Vector3(u.to[0], u.airBurst || 0.2, u.to[1]);
  const dist = start.distanceTo(end);
  const mid = start.clone().lerp(end, 0.5);
  mid.y = 6 + dist * 0.25;
  return new THREE.QuadraticBezierCurve3(start, mid, end);
}

/* 在地图上绘制虚线轨迹 + 起点/落点标记 */
function showUtility(u) {
  clearGroup(trajectoryGroup);
  drawUtility(u);
}

/* 只追加绘制，不清空（供多道具阶段同时显示） */
function drawUtility(u) {
  const color = UTIL_TYPES[u.type].color;
  const curve = getThrowCurve(u);

  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(60)),
    new THREE.LineDashedMaterial({ color, dashSize: 1.2, gapSize: 0.8, transparent: true, opacity: 0.95 })
  );
  line.computeLineDistances();
  trajectoryGroup.add(line);

  // 出手点标记
  const fromMark = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 12),
    new THREE.MeshBasicMaterial({ color })
  );
  fromMark.position.set(u.from[0], 0.5, u.from[1]);
  trajectoryGroup.add(fromMark);

  // 落点脉冲圆环
  landingRing = new THREE.Mesh(
    new THREE.RingGeometry(1.2, 1.7, 32),
    new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
  );
  landingRing.rotation.x = -Math.PI / 2;
  landingRing.position.set(u.to[0], 0.12, u.to[1]);
  trajectoryGroup.add(landingRing);
}

/* 播放投掷动画：弹体沿曲线飞行 1.6s */
function playThrow(u = currentUtility) {
  if (!u || activeThrow) return;
  showUtility(u);
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshStandardMaterial({ color: UTIL_TYPES[u.type].color, roughness: 0.4 })
  );
  mesh.castShadow = true;
  effectsGroup.add(mesh);
  activeThrow = { curve: getThrowCurve(u), mesh, life: 0, duration: 1.6, utility: u };
}

function updateThrow(dt) {
  if (!activeThrow) return;
  activeThrow.life += dt;
  const t = Math.min(activeThrow.life / activeThrow.duration, 1);
  activeThrow.mesh.position.copy(activeThrow.curve.getPointAt(t));
  if (t >= 1) {
    effectsGroup.remove(activeThrow.mesh);
    activeThrow.mesh.geometry.dispose();
    activeThrow.mesh.material.dispose();
    spawnEffect(activeThrow.utility);
    activeThrow = null;
  }
}

/* 落地效果：烟（扩散灰球）/ 闪（白爆+强光）/ 火（地面火盘） */
function spawnEffect(u) {
  const [x, z] = u.to;

  if (u.type === 'smoke') {
    const mat = new THREE.MeshStandardMaterial({
      color: 0xb8c0c6, transparent: true, opacity: 0, roughness: 1, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 20), mat);
    mesh.position.set(x, 2.2, z);
    effectsGroup.add(mesh);
    activeEffects.push({ objects: [mesh], life: 0, duration: 5.5, update(life) {
      const grow = Math.min(life / 0.8, 1);
      mesh.scale.setScalar(1 + grow * 3.5);
      if (life < 0.8) mat.opacity = 0.65 * grow;
      else if (life > 4.5) mat.opacity = 0.65 * Math.max(1 - (life - 4.5) / 1, 0);
    }});
  } else if (u.type === 'flash') {
    const y = u.airBurst || 2;
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), mat);
    mesh.position.set(x, y, z);
    const light = new THREE.PointLight(0xfff6d8, 80, 50);
    light.position.set(x, y, z);
    effectsGroup.add(mesh, light);
    activeEffects.push({ objects: [mesh, light], life: 0, duration: 0.5, update(life) {
      const p = life / 0.5;
      mesh.scale.setScalar(1 + p * 6);
      mat.opacity = 1 - p;
      light.intensity = 80 * (1 - p);
    }});
  } else { // molotov
    const mat = new THREE.MeshBasicMaterial({
      color: 0xff6d2d, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false,
    });
    const mesh = new THREE.Mesh(new THREE.CircleGeometry(3, 24), mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x, 0.15, z);
    const light = new THREE.PointLight(0xff7a3d, 25, 20);
    light.position.set(x, 1.5, z);
    effectsGroup.add(mesh, light);
    activeEffects.push({ objects: [mesh, light], life: 0, duration: 3, update(life) {
      mesh.scale.setScalar(1 + 0.1 * Math.sin(life * 20)); // 火焰脉动
      const fade = life > 2.2 ? Math.max(1 - (life - 2.2) / 0.8, 0) : 1;
      mat.opacity = 0.85 * fade;
      light.intensity = 25 * fade;
    }});
  }
}

function updateEffects(dt) {
  for (let i = activeEffects.length - 1; i >= 0; i--) {
    const e = activeEffects[i];
    e.life += dt;
    if (e.life >= e.duration) {
      e.objects.forEach(obj => {
        effectsGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
      });
      activeEffects.splice(i, 1);
    } else {
      e.update(e.life);
    }
  }
  // 落点圆环脉冲
  if (landingRing && trajectoryGroup.children.includes(landingRing)) {
    landingRing.scale.setScalar(1 + 0.15 * Math.sin(performance.now() / 200));
  }
}

/* 清空分组并释放资源 */
function clearGroup(group) {
  while (group.children.length) {
    const child = group.children.pop();
    child.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }
}

const STORAGE_KEY = 'cs2-tactic-custom-v3'; // 地图布局改版后旧 key 数据作废
let phaseTween = null;        // { life, duration, from, to, onDone }
let playback = null;          // { tactic, idx, timer }
const pendingThrows = [];     // { utility, delay }

function initTactics() {
  // 阶段页签
  document.querySelectorAll('.phase-tabs button').forEach(btn => {
    btn.addEventListener('click', () => gotoPhase(Number(btn.dataset.phase)));
  });
  // 播放 / 停止
  document.getElementById('btn-play-tactic').addEventListener('click', () => {
    if (playback) stopPlayback();
    else startPlayback();
  });
  // 方案切换
  document.getElementById('sel-plan').addEventListener('change', e => {
    stopPlayback();
    if (e.target.value === 'custom') {
      const saved = loadCustom();
      if (saved) applyCustom(saved);
    } else {
      gotoPhase(0);
    }
  });
  // 保存 / 导出 / 导入
  document.getElementById('btn-save').addEventListener('click', saveCustom);
  document.getElementById('btn-export').addEventListener('click', exportCustom);
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', importCustom);

  // 启动时恢复上次保存的自定义布置
  const saved = loadCustom();
  if (saved) applyCustom(saved);
}

function getCurrentTactic() {
  const v = document.getElementById('sel-plan').value;
  return v === 'custom' ? null : TACTICS[v];
}

/* 跳转到指定阶段：队员补间移动 + 显示该阶段道具轨迹 */
function gotoPhase(idx) {
  const tactic = getCurrentTactic();
  setActivePhaseTab(idx);
  if (!tactic) return;
  stopPlayback();
  const phase = tactic.phases[idx];
  tweenToPhase(phase.players, 1.2);
  clearGroup(trajectoryGroup);
  phase.utils.forEach(uid => drawUtility(UTILITIES.find(u => u.id === uid)));
}

function setActivePhaseTab(idx) {
  document.querySelectorAll('.phase-tabs button').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.phase) === idx);
  });
}

/* ---- 自动演示播放 ---- */
function startPlayback() {
  const tactic = getCurrentTactic();
  const btn = document.getElementById('btn-play-tactic');
  if (!tactic) {
    btn.textContent = '先选内置战术';
    setTimeout(() => { btn.textContent = '▶ 播放'; }, 1200);
    return;
  }
  playback = { tactic, idx: 0, timer: 0 };
  btn.textContent = '⏸ 停止';
  playPhase(0);
}

function stopPlayback() {
  playback = null;
  pendingThrows.length = 0;
  document.getElementById('btn-play-tactic').textContent = '▶ 播放';
}

function playPhase(idx) {
  if (!playback) return;
  setActivePhaseTab(idx);
  const phase = playback.tactic.phases[idx];
  // 队员 2s 推进到位
  tweenToPhase(phase.players, 2.0, () => {
    if (!playback) return;
    // 该阶段道具依次投出
    phase.utils.forEach((uid, i) => {
      pendingThrows.push({ utility: UTILITIES.find(u => u.id === uid), delay: 0.3 + i * 1.0 });
    });
    // 停留一段时间（覆盖道具动画）后进入下一阶段
    playback.timer = 2.0 + phase.utils.length * 1.2;
  });
}

/* ---- 位置补间（smoothstep 缓动） ---- */
function tweenToPhase(targets, duration, onDone) {
  const from = {}, to = {};
  players.forEach(p => {
    from[p.id] = p.group.position.clone();
    const pos = targets[p.id];
    to[p.id] = pos
      ? new THREE.Vector3(pos[0], groundHeightAt(pos[0], pos[1]), pos[1])
      : p.group.position.clone();
  });
  phaseTween = { life: 0, duration, from, to, onDone };
}

function updatePhaseTween(dt) {
  if (!phaseTween) return;
  phaseTween.life += dt;
  const t = Math.min(phaseTween.life / phaseTween.duration, 1);
  const k = t * t * (3 - 2 * t);
  players.forEach(p => {
    p.group.position.lerpVectors(phaseTween.from[p.id], phaseTween.to[p.id], k);
  });
  if (t >= 1) {
    const cb = phaseTween.onDone;
    phaseTween = null;
    if (cb) cb();
  }
}

/* 排队中的道具投掷（等上一发飞完再投） */
function updatePendingThrows(dt) {
  for (let i = pendingThrows.length - 1; i >= 0; i--) {
    const pt = pendingThrows[i];
    pt.delay -= dt;
    if (pt.delay <= 0 && !activeThrow) {
      playThrow(pt.utility);
      pendingThrows.splice(i, 1);
    }
  }
}

/* 播放状态推进：补间结束并停留计时后进入下一阶段 */
function updatePlayback(dt) {
  if (!playback || phaseTween) return;
  playback.timer -= dt;
  if (playback.timer <= 0) {
    playback.idx++;
    if (playback.idx >= PHASES.length) stopPlayback();
    else playPhase(playback.idx);
  }
}

/* ---- 自定义方案：保存 / 读取 / 导出 / 导入 ---- */
function collectCustom() {
  return {
    name: '我的布置',
    players: players.map(p => ({
      id: p.id,
      role: p.role,
      x: Math.round(p.group.position.x * 10) / 10,
      z: Math.round(p.group.position.z * 10) / 10,
    })),
  };
}

function saveCustom() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(collectCustom()));
  const btn = document.getElementById('btn-save');
  btn.textContent = '已保存 ✓';
  setTimeout(() => { btn.textContent = '保存'; }, 1200);
}

function loadCustom() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function applyCustom(data) {
  if (!data || !Array.isArray(data.players)) return;
  data.players.forEach(entry => {
    const p = players.find(pl => pl.id === entry.id);
    if (!p) return;
    if (entry.role && ROLES[entry.role]) setRole(p, entry.role);
    if (typeof entry.x === 'number' && typeof entry.z === 'number') {
      p.group.position.set(entry.x, groundHeightAt(entry.x, entry.z), entry.z);
    }
  });
}

function exportCustom() {
  const blob = new Blob([JSON.stringify(collectCustom(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cs2-tactic.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importCustom(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.players)) throw new Error('bad format');
      applyCustom(data);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      document.getElementById('sel-plan').value = 'custom';
    } catch {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

/* ------------------------------------------------------------
 * 窗口自适应
 * ---------------------------------------------------------- */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ------------------------------------------------------------
 * 主循环
 * ---------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  updateThrow(dt);
  updateEffects(dt);
  updatePhaseTween(dt);
  updatePendingThrows(dt);
  updatePlayback(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------
 * 启动（所有 const 声明就绪后再初始化，避免 TDZ 错误）
 * ---------------------------------------------------------- */
init();
animate();

/* 俯视截图模式：?shot=1 正上方相机 + 隐藏 UI/队员/标签，供无头浏览器渲染 */
if (new URLSearchParams(location.search).has('shot')) {
  document.body.classList.add('shot');
  camera.position.set(0, 155, 0.01);
  controls.target.set(0, 0, 0);
  controls.update();
  playersGroup.visible = false;
  scene.traverse(o => { if (o.isSprite) o.visible = false; });
}
</script>
