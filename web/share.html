<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 战术板 · 分享查看</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; }

  .glass-panel {
    position: fixed;
    background: rgba(16, 22, 32, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    color: #dfe6ee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  #panel-top {
    top: 16px; left: 16px;
    padding: 10px 16px;
    z-index: 10;
  }
  #panel-top h1 { font-size: 16px; font-weight: 600; letter-spacing: 1px; color: #f0f4f8; }
  #panel-top h1 span { color: #ffa940; }
  #panel-top .subtitle { margin-top: 4px; font-size: 11px; color: #8b98a8; }

  #loading {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 24px 36px;
    text-align: center;
    min-width: 320px;
  }
  #loading .title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  #loading .bar-track {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  #loading .bar-fill {
    height: 100%; width: 0%;
    background: #ffa940;
    border-radius: 3px;
    transition: width 0.2s;
  }
  #loading .pct { margin-top: 8px; font-size: 12px; color: #8b98a8; }

  #error-msg {
    display: none;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 32px;
    text-align: center;
    color: #ff5252;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel-top" class="glass-panel">
  <h1>CS2 <span>战术板</span> · 分享查看</h1>
  <div class="subtitle" id="tactic-name">正在加载…</div>
</div>

<div id="loading" class="glass-panel">
  <div class="title">正在加载 de_dust2 官方地图模型…</div>
  <div class="bar-track"><div class="bar-fill" id="load-bar"></div></div>
  <div class="pct" id="load-pct">0%</div>
</div>

<div id="error-msg" class="glass-panel"></div>

<script type="module" src="/src/view.ts"></script>
</body>
</html>
