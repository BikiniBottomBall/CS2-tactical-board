<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 战术板 - de_dust2 真实地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; }

  /* ===== 暗色毛玻璃 UI ===== */
  .glass-panel {
    position: fixed;
    background: rgba(16, 22, 32, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    color: #dfe6ee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  #panel-top {
    top: 16px; left: 16px;
    padding: 14px 18px;
    min-width: 220px;
  }
  #panel-top h1 { font-size: 16px; font-weight: 600; letter-spacing: 1px; color: #f0f4f8; }
  #panel-top h1 span { color: #ffa940; }
  #panel-top .subtitle { margin-top: 4px; font-size: 11px; color: #8b98a8; }

    transform: translate(-50%, -50%);
    padding: 24px 36px;
    text-align: center;

  }

    width: 100%; height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  #loading .bar-fill {
    height: 100%; width: 0%;

    border-radius: 3px;

    font-weight: 600;
    font-family: inherit;
    color: #0d1219;
    background: #ffa940;

    border-radius: 8px;

  #btn-topview:hover { background: #ffb85c; }

    top: 64px; right: 16px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    color: #c8d2dd;
    background: rgba(16, 22, 32, 0.55);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;

  }
  #btn-calib:hover { background: rgba(40, 50, 65, 0.75); }
  body.calib #btn-calib { color: #0d1219; background: #ffa940; border-color: #ffa940; }
  body.calib canvas { cursor: crosshair; }

  /* 当前模式指示徽章（顶部居中，防止搞混标点/转镜头） */
  #mode-badge {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    font-size: 12px;
    font-family: inherit;
    border-radius: 20px;
    z-index: 10;
    pointer-events: none;
    color: #c8d2dd;
    background: rgba(16, 22, 32, 0.55);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  body.calib #mode-badge {
    color: #0d1219;
    font-weight: 600;
    background: #ffa940;
    border-color: #ffa940;
  }
  body.shot #mode-badge { display: none !important; }

  #panel-calib {
    top: 108px; right: 16px;
    width: 250px;
    padding: 12px 14px;
    display: none;
  }
  body.calib #panel-calib { display: block; }
  body.shot #btn-calib, body.shot #panel-calib { display: none !important; }
  .calib-title { font-size: 13px; font-weight: 600; color: #f0f4f8; margin-bottom: 4px; }
  .calib-hint { font-size: 11px; color: #8b98a8; margin-bottom: 8px; line-height: 1.5; }
  #calib-coords { font-size: 12px; color: #ffa940; margin-bottom: 8px; font-family: Consolas, monospace; }
  .calib-row { display: flex; gap: 6px; }
  #calib-name {
    flex: 1;
    padding: 7px 8px;
    font-size: 12px;
    font-family: inherit;
    color: #dfe6ee;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    outline: none;
  }
  #calib-save {
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    color: #0d1219;
    background: #ffa940;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #calib-list { margin-top: 10px; max-height: 220px; overflow-y: auto; }
  .calib-modes { display: flex; gap: 6px; margin-bottom: 8px; }
  .calib-modes button {
    flex: 1;
    padding: 6px 0;
    font-size: 12px;
    font-family: inherit;
    color: #c8d2dd;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    cursor: pointer;
  }
  .calib-modes button.active { color: #0d1219; font-weight: 600; background: #ffa940; border-color: #ffa940; }
  #calib-layer { font-size: 11px; color: #7ec8ff; margin-bottom: 6px; min-height: 14px; }
  #calib-height-row { align-items: center; margin-bottom: 8px; }
  #calib-height-row button {
    width: 28px; padding: 4px 0;
    font-size: 14px; font-weight: 600;
    color: #c8d2dd;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);

  }
  #calib-height-row button:hover { background: rgba(255,255,255,0.14); }
  #calib-height { flex: 1; text-align: center; font-size: 11px; color: #8b98a8; }
  #calib-parent {

    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);

  #calib-parent option { background: #101620; }
  .calib-mini-btn {
    flex: 1;
    padding: 5px 0;
    font-size: 11px;
    font-family: inherit;
    color: #c8d2dd;
    background: rgba(255,255,255,0.06);

    cursor: pointer;

  .calib-mini-btn:hover { background: rgba(255,255,255,0.14); }
  .calib-style-editor {

  .scale-row {

  .scale-row input { flex: 1; accent-color: #ffa940; }
  .calib-font-btn {

  .calib-item {

    gap: 6px;

  /* ===== 左侧工具栏 ===== */

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js",
    "delaunator": "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import Delaunator from 'delaunator';

/* BVH 加速射线（贴地投影采样量大，必须用） */
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

/* ============================================================
 * 纯色材质分类规则（雷达图配色）
 * 按节点名启发式分类；HIDDEN 是编辑器工具网格（游戏内不可见）
 * ============================================================ */
const COLORS = {
  ground: 0xc9b28c,  // 地面/道路：浅沙色
  wall:   0x7d828a,  // 墙体/建筑：深灰色
  prop:   0x9a7a4e,  // 箱子/掩体道具：棕色
};

/* 编辑器工具网格 + alpha 贴片/特效片（电线/晾布/藤蔓/蒸汽/光柱/浮尘卡，去贴图后变实心碎片） */
const RE_HIDDEN = /blocklight|overlay|nodraw|skybox|_sky|clipbrush|trigger|wire|leaves|weed|agave|awning|tarp|fabric|rope|laundry|chainlink|_card|cloth|vine|ivy|steam|lightshaft|light_shaft|dust_001/i;
const RE_GROUND = /ground|asphalt|sand|floortile|brick_ground|curb|road/i;
const RE_PROP   = /crate|pallet|\bcart|\bcar|truck|drum|barrel|sack|detruis|basket|pottery|terracotta|dumpster|garbage|box|chair|umbrella|door_\d|table|shelf|vehicle/i;

function categorize(name) {
  if (RE_HIDDEN.test(name)) return 'hidden';
  if (RE_GROUND.test(name)) return 'ground';
  if (RE_PROP.test(name)) return 'prop';
  return 'wall';
}

/* ============================================================ */
let scene, camera, renderer, controls, mapGroup;
let mapBounds = null; // 模型实际包围盒（归一化后）
let collisionMesh = null; // 地面碰撞层（仅 map-ground，区域投影只打它，忽略树/栏杆/箱子）
const flyClock = new THREE.Clock();

function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  document.getElementById('app').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1219);
  scene.fog = new THREE.Fog(0x0d1219, 500, 1800);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(120, 140, 120);

  // 灯光：精简两盏（性能考虑，不删几何）
  scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x8a6f4d, 1.8));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(80, 160, 60);
  scene.add(sun);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.05;

  initFlyControls();
  initBoard();
  initCalib();

  // 正俯视 / 斜 45° 切换按钮
  document.getElementById('btn-topview').addEventListener('click', () => {
    if (isTopView) resetCamera();
    else setTopView();
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  loadMap();
  animate();
}

/* ------------------------------------------------------------
 * 加载官方 de_dust2 模型：几何原样保留，仅合并静态网格（不减面）
 * ---------------------------------------------------------- */
function loadMap() {
  const bar = document.getElementById('load-bar');
  const pct = document.getElementById('load-pct');
  const loader = new GLTFLoader();
  // Draco 压缩模型（data/models/ 管线产物）
  const draco = new DRACOLoader();
  draco.setDecoderPath('libs/draco/'); // 本地解码器，避免 CDN Worker 问题
  loader.setDRACOLoader(draco);

  loader.load(
    'data/models/de_dust2.glb',
    (gltf) => {
      pct.textContent = '解析几何体…';
      buildMergedMap(gltf.scene);
      document.getElementById('loading').style.display = 'none';
      onMapReady();
    },
    (ev) => {
      if (ev.total > 0) {
        const p = Math.round(ev.loaded / ev.total * 100);
        bar.style.width = p + '%';
        pct.textContent = `${p}%（${Math.round(ev.loaded / 1048576)} / ${Math.round(ev.total / 1048576)} MB）`;
      } else {
        pct.textContent = `已下载 ${Math.round(ev.loaded / 1048576)} MB…`;
      }
    },
    (err) => {
      pct.textContent = '加载失败：' + err.message;
      console.error(err);
    }
  );
}

/* 按分类合并静态网格（性能优化手段，不删除任何可见几何）
 * 过滤规则（仅影响渲染，不改模型文件，可随时恢复）：
 *  1) 名称命中布料/物理关键词（按非字母数字切分后整词匹配）
 *  2) 蒙皮网格（isSkinnedMesh）：布料模拟物件，蒙皮丢失后顶点拉伸变形
 * 过滤与保留名单均打印到 console 供核对
 */
const CLOTH_KEYWORDS = ['cloth', 'awning', 'tarp', 'flag', 'fabric', 'curtain', 'canopy', 'physics', 'collision', 'shadow', 'lod'];

function matchClothKeyword(name) {
  if (!name) return null;
  const segs = String(name).toLowerCase().split(/[^a-z0-9]+/);
  return CLOTH_KEYWORDS.find(k => segs.includes(k)) || null;
}

function buildMergedMap(root) {
  root.updateMatrixWorld(true);
  const buckets = { ground: [], wall: [], prop: [] };
  const filteredCloth = [];   // 布料/物理/蒙皮过滤名单
  const keptNames = new Set(); // 保留名单（核对误删用）
  let hiddenCount = 0;

  root.traverse(obj => {
    if (!obj.isMesh) return;
    const name = obj.name || '';

    // --- 布料模拟 / 物理 / LOD 过滤 ---
    const kw = matchClothKeyword(name) || matchClothKeyword(obj.geometry && obj.geometry.name);
    if (kw) {
      filteredCloth.push(`${name}（关键词: ${kw}）`);
      return; // 不加入场景 = 移除渲染；模型文件未动
    }
    if (obj.isSkinnedMesh) {
      filteredCloth.push(`${name}（蒙皮网格）`);
      return;
    }

    const cat = categorize(name);
    if (cat === 'hidden') { hiddenCount++; return; }

    // 就地应用世界变换（原 gltf 场景随后整体丢弃）
    let geo = obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry;
    geo.applyMatrix4(obj.matrixWorld);
    // 只保留 position + normal，便于跨网格合并
    for (const key of Object.keys(geo.attributes)) {
      if (key !== 'position' && key !== 'normal') geo.deleteAttribute(key);
    }
    if (!geo.attributes.normal) geo.computeVertexNormals();
    geo.morphAttributes = {};
    buckets[cat].push(geo);
    keptNames.add(name.replace(/\.meshset.*$/, ''));
  });

  console.log(`[filter] 已过滤布料/物理/LOD/蒙皮节点 ${filteredCloth.length} 个：`, filteredCloth);
  console.log(`[filter] 保留的网格名（${keptNames.size} 种，核对是否误删用）:`, [...keptNames].sort());
  console.log(`[map] 隐藏工具网格 ${hiddenCount} 个；合并：ground=${buckets.ground.length} wall=${buckets.wall.length} prop=${buckets.prop.length}`);

  mapGroup = new THREE.Group();
  mapGroup.name = 'dust2-map';
  for (const cat of ['ground', 'wall', 'prop']) {
    if (!buckets[cat].length) continue;
    const merged = BufferGeometryUtils.mergeGeometries(buckets[cat], false);
    const mesh = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ color: COLORS[cat] }));
    mesh.name = `map-${cat}`;
    mapGroup.add(mesh);
  }

  // 按模型实际包围盒归一化：最长水平边 = 240，底面中心对齐原点
  const bbox = new THREE.Box3().setFromObject(mapGroup);
  const size = bbox.getSize(new THREE.Vector3());
  const center = bbox.getCenter(new THREE.Vector3());
  const s = 240 / Math.max(size.x, size.z);
  mapGroup.scale.setScalar(s);
  mapGroup.position.set(-center.x * s, -bbox.min.y * s, -center.z * s);
  scene.add(mapGroup);

  mapGroup.updateMatrixWorld(true);
  mapBounds = new THREE.Box3().setFromObject(mapGroup);

  // 地面碰撞层：区域投影只 raycast 它，并为它构建 BVH
  collisionMesh = mapGroup.getObjectByName('map-ground') || null;
  if (collisionMesh) collisionMesh.geometry.computeBoundsTree();
  console.log('[map] 归一化后包围盒', mapBounds);
}

function onMapReady() {
  controls.maxDistance = mapBounds.getSize(new THREE.Vector3()).length() * 2;
  resetCamera();
  restoreBoard(); // 恢复上次保存的标记和线条
  loadPositions().then(renderPositionLabels); // 点位标注（positions.json）
  window.__mapReady = true; // e2e 就绪信号

  // 正俯视截图模式（?shot=1）
  if (new URLSearchParams(location.search).has('shot')) {
    document.body.classList.add('shot');
    setTopView();
  }
}

/* ------------------------------------------------------------
 * WASD 飞行移动：沿相机朝向平移（W/S 前后，A/D 左右，Q/E 升降，
 * Shift 加速），速度随观察距离缩放
 * ---------------------------------------------------------- */
const flyKeys = new Set();

function initFlyControls() {
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return; // 输入框打字不触发快捷键
    if (e.code === 'KeyR') { resetCamera(); return; }
    flyKeys.add(e.code);
  });
  window.addEventListener('keyup', e => flyKeys.delete(e.code));
  window.addEventListener('blur', () => flyKeys.clear());
}

const _flyDir = new THREE.Vector3();
const _flyRight = new THREE.Vector3();
const _flyMove = new THREE.Vector3();

function updateFlyControls(dt) {
  if (!flyKeys.size) return;
  const boost = (flyKeys.has('ShiftLeft') || flyKeys.has('ShiftRight')) ? 3 : 1;
  // 速度随相机到目标距离缩放，远处快、近处慢
  const speed = Math.max(camera.position.distanceTo(controls.target) * 0.8, 10) * boost;

  camera.getWorldDirection(_flyDir);
  _flyDir.y = 0;
  _flyDir.normalize();
  _flyRight.crossVectors(_flyDir, new THREE.Vector3(0, 1, 0)).negate();

  _flyMove.set(0, 0, 0);
  if (flyKeys.has('KeyW')) _flyMove.add(_flyDir);
  if (flyKeys.has('KeyS')) _flyMove.sub(_flyDir);
  if (flyKeys.has('KeyA')) _flyMove.add(_flyRight);
  if (flyKeys.has('KeyD')) _flyMove.sub(_flyRight);
  if (flyKeys.has('PageUp')) _flyMove.y += 1;
  if (flyKeys.has('PageDown')) _flyMove.y -= 1;
  if (_flyMove.lengthSq() === 0) return;

  _flyMove.normalize().multiplyScalar(speed * dt);
  camera.position.add(_flyMove);
  controls.target.add(_flyMove);
  clampToMap();
}

/* 限制相机与目标点不飞出地图范围（防止 WASD 飞丢） */
const _clampMin = new THREE.Vector3();
const _clampMax = new THREE.Vector3();

function clampToMap() {
  if (!mapBounds) return;
  _clampMin.set(mapBounds.min.x - 120, mapBounds.min.y - 30, mapBounds.min.z - 120);
  _clampMax.set(mapBounds.max.x + 120, mapBounds.max.y + 260, mapBounds.max.z + 120);
  camera.position.clamp(_clampMin, _clampMax);
  controls.target.clamp(_clampMin, _clampMax);
}

/* 复位到默认斜 45° 俯瞰 */
let isTopView = false;

function resetCamera() {
  if (!mapBounds) return;
  const size = mapBounds.getSize(new THREE.Vector3());
  const center = mapBounds.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.z) * 0.72;
  camera.up.set(0, 1, 0);
  camera.position.set(center.x + r, r * 1.1, center.z + r);
  controls.target.copy(center);
  controls.update();
  isTopView = false;
  updateTopViewBtn();
}

/* 正俯视：垂直向下，地图摆正（逆时针 90°：匪家下 / B 左上 / A 右上）
 * 不改 camera.up（恒为 Y 轴向上），与斜 45° 共用同一套 OrbitControls 旋转逻辑；
 * x 方向加 -0.01 偏移避免视线与 up 共线，Y-up 下屏幕上方即世界 +X
 */
function setTopView() {
  if (!mapBounds) return;
  const size = mapBounds.getSize(new THREE.Vector3());
  const center = mapBounds.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.z) * 0.72;
  camera.position.set(center.x, mapBounds.max.y + r * 1.7, center.z + 0.01);
  controls.target.copy(center);
  controls.update();
  isTopView = true;
  updateTopViewBtn();
}

function updateTopViewBtn() {
  const btn = document.getElementById('btn-topview');
  if (btn) btn.textContent = isTopView ? '↩ 斜 45° 视角' : '⬇ 正俯视视角';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(flyClock.getDelta(), 0.1);
  updateFlyControls(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------
 * 战术板：T/CT 标记、画笔箭头路线、烟闪火道具
 * 橡皮擦 / 撤销 / 清空 / localStorage 持久化
 * 所有放置与拖拽均 raycast 地图表面取高度，贴地不悬空
 * ---------------------------------------------------------- */
const STORAGE_KEY_BOARD = 'cs2-board-v1';
const MARKER_DEFS = {
  'marker-t':  { label: 'T',  color: 0xff7a3d, css: '#ff7a3d', big: true },
  'marker-ct': { label: 'CT', color: 0x5aa9ff, css: '#5aa9ff', big: true },
  'smoke':     { label: '烟', color: 0x9aa5ad, css: '#9aa5ad', big: false },
  'flash':     { label: '闪', color: 0xffe082, css: '#ffe082', big: false },
  'molotov':   { label: '火', color: 0xff7043, css: '#ff7043', big: false },
};
const LINE_COLOR = 0xff5252;

let currentTool = 'select';
const markersGroup = new THREE.Group();
const linesGroup = new THREE.Group();
const boardItems = new Map(); // id -> { type:'marker'|'line', group, kind?, points? }
let boardSeq = 1;
const undoStack = [];         // 添加顺序的 id 栈

let dragMarkerId = null;
let drawing = null;           // { id, points: Vector3[], line }
let pointerMoved = false;

const boardRaycaster = new THREE.Raycaster();
const boardPointer = new THREE.Vector2();

function initBoard() {
  markersGroup.name = 'markers';
  linesGroup.name = 'lines';
  scene.add(markersGroup, linesGroup);

  // 工具栏
  document.querySelectorAll('#toolbar button[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => setTool(btn.dataset.tool));
  });
  document.getElementById('btn-undo').addEventListener('click', undoBoard);
  document.getElementById('btn-clear').addEventListener('click', clearBoard);
  document.getElementById('btn-tb-topview').addEventListener('click', () => {
    document.getElementById('btn-topview').click();
  });
  window.addEventListener('keydown', e => {
    // 校准模式下 Ctrl+Z 归校准系统（撤销顶点），不触发画板撤销
    if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey) && !calibMode) undoBoard();
  });

  // 全局标记大小滑杆
  const scaleSlider = document.getElementById('marker-scale');
  scaleSlider.value = String(markerScale);
  scaleSlider.addEventListener('input', () => setMarkerScale(parseFloat(scaleSlider.value)));

  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', onBoardPointerDown);
  window.addEventListener('pointermove', onBoardPointerMove);
  window.addEventListener('pointerup', onBoardPointerUp);
  dom.addEventListener('contextmenu', onBoardRightClick);
}

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
}

function setBoardPointer(e) {
  boardPointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  boardPointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  boardRaycaster.setFromCamera(boardPointer, camera);
}

/* 射线求与地图表面的交点（贴地关键） */
function raycastMapPoint(e) {
  if (!mapGroup) return null;
  setBoardPointer(e);
  const hits = boardRaycaster.intersectObjects(mapGroup.children, false);
  return hits.length ? hits[0].point.clone() : null;
}

/* 拾取已放置的标记/线条（沿父链找 itemId） */
function pickBoardItem(e) {
  setBoardPointer(e);
  const hits = boardRaycaster.intersectObjects(
    [...markersGroup.children, ...linesGroup.children], true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && obj.userData.itemId === undefined) obj = obj.parent;
  return obj ? obj.userData.itemId : null;
}

/* ---- 标记创建 ---- */
function createMarkerSprite(text, cssColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const fontSize = text.length <= 2 ? 56 : text.length <= 4 ? 40 : 28;
  ctx.font = `bold ${fontSize}px "Segoe UI", "Microsoft YaHei", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 半透明深色底 + 描边，保证任何地图底色上可读
  const tw = Math.min(ctx.measureText(text).width + 36, 246);
  const th = fontSize + 26;
  ctx.fillStyle = 'rgba(10, 14, 20, 0.62)';
  ctx.beginPath();
  ctx.roundRect((256 - tw) / 2, (128 - th) / 2, tw, th, 12);
  ctx.fill();
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(text, 128, 64);
  ctx.fillStyle = cssColor;
  ctx.fillText(text, 128, 64);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(canvas), transparent: true, depthTest: false,
    sizeAttenuation: false, // 屏幕尺寸恒定，不随地图缩放变化
  }));
  return sprite;
}

/* 实心小圆点纹理（点标记用） */
let _dotTexture = null;
function getDotTexture() {
  if (_dotTexture) return _dotTexture;
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(32, 32, 26, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.stroke();
  _dotTexture = new THREE.CanvasTexture(canvas);
  return _dotTexture;
}

/* 全局标记缩放（滑杆调节，localStorage 持久化） */
let markerScale = parseFloat(localStorage.getItem('cs2-marker-scale') || '1');

function setMarkerScale(v) {
  markerScale = v;
  localStorage.setItem('cs2-marker-scale', String(v));
  renderPositionLabels();
}

function createMarker(toolKey, pos) {
  const def = MARKER_DEFS[toolKey];
  const group = new THREE.Group();

  const r = def.big ? 2.4 : 1.7;
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, 0.5, 24),
    new THREE.MeshLambertMaterial({ color: def.color })
  );
  base.position.y = 0.25;
  group.add(base);

  const sprite = createMarkerSprite(def.label, def.css);
  sprite.scale.set(def.big ? 0.16 : 0.13, def.big ? 0.08 : 0.065, 1);
  sprite.position.y = def.big ? 4.2 : 3.4;
  group.add(sprite);

  group.position.copy(pos);
  const id = boardSeq++;
  group.userData.itemId = id;
  markersGroup.add(group);
  boardItems.set(id, { type: 'marker', group, kind: toolKey });
  return id;
}

/* ---- 线条创建（贴地点序列 + 末端箭头） ---- */
function createLineObject(points) {
  const group = new THREE.Group();
  const lifted = points.map(p => new THREE.Vector3(p.x, p.y + 0.4, p.z));
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(lifted),
    new THREE.LineBasicMaterial({ color: LINE_COLOR })
  );
  group.add(line);

  // 末端箭头锥
  if (points.length >= 2) {
    const end = lifted[lifted.length - 1];
    const prev = lifted[lifted.length - 2];
    const dir = end.clone().sub(prev);
    dir.y = 0;
    if (dir.lengthSq() > 0.001) {
      dir.normalize();
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(1.3, 3, 12),
        new THREE.MeshLambertMaterial({ color: LINE_COLOR })
      );
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      cone.position.copy(end).addScaledVector(dir, -1.5);
      cone.position.y = end.y + 0.2;
      group.add(cone);
    }
  }
  return group;
}

/* ---- 增删 / 撤销 / 清空 ---- */
function removeBoardItem(id) {
  const item = boardItems.get(id);
  if (!item) return;
  const parent = item.type === 'marker' ? markersGroup : linesGroup;
  parent.remove(item.group);
  item.group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  boardItems.delete(id);
  const i = undoStack.indexOf(id);
  if (i >= 0) undoStack.splice(i, 1);
}

function undoBoard() {
  const id = undoStack.pop();
  if (id !== undefined) {
    removeBoardItem(id);
    saveBoard();
  }
}

function clearBoard() {
  [...boardItems.keys()].forEach(removeBoardItem);
  undoStack.length = 0;
  saveBoard();
}

/* ---- localStorage 持久化 ---- */
function saveBoard() {
  const markers = [], lines = [];
  boardItems.forEach(item => {
    if (item.type === 'marker') {
      const p = item.group.position;
      markers.push({ kind: item.kind, x: p.x, y: p.y, z: p.z });
    } else {
      lines.push({ points: item.points.map(p => [p.x, p.y, p.z]) });
    }
  });
  localStorage.setItem(STORAGE_KEY_BOARD, JSON.stringify({ markers, lines }));
}

function restoreBoard() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_BOARD);
    if (!raw) return;
    const data = JSON.parse(raw);
    (data.markers || []).forEach(m => {
      if (!MARKER_DEFS[m.kind]) return;
      const id = createMarker(m.kind, new THREE.Vector3(m.x, m.y, m.z));
      undoStack.push(id);
    });
    (data.lines || []).forEach(l => {
      if (!Array.isArray(l.points) || l.points.length < 2) return;
      const points = l.points.map(a => new THREE.Vector3(a[0], a[1], a[2]));
      const group = createLineObject(points);
      const id = boardSeq++;
      group.userData.itemId = id;
      linesGroup.add(group);
      boardItems.set(id, { type: 'line', group, points });
      undoStack.push(id);
    });
  } catch (err) {
    console.warn('[board] 恢复存档失败', err);
  }
}

/* ---- 指针交互 ---- */
function onBoardPointerDown(e) {
  if (e.button !== 0 || !mapGroup) return;
  pointerMoved = false;

  // 校准模式：点模式分层取点 / 区域模式放顶点 / 编辑模式拖顶点
  // 按住 Alt（旋转）或空格（平移）时左键归镜头，不标点
  if (calibMode) {
    if (altHeld || spaceHeld) return;
    if (editingRegion) { onEditPointerDown(e); return; }
    if (calibDrawMode === 'region') {
      const hits = raycastMapAll(e);
      if (hits.length) addRegionVertex(hits[0].point);
    } else {
      calibHits = raycastMapAll(e);
      if (calibHits.length) selectCalibHit(0);
    }
    return;
  }

  if (currentTool === 'select') {
    const id = pickBoardItem(e);
    if (id !== null && boardItems.get(id)?.type === 'marker') {
      dragMarkerId = id;
      controls.enabled = false;
    }
  } else if (currentTool === 'brush') {
    const pt = raycastMapPoint(e);
    if (pt) {
      drawing = { points: [pt], line: null };
      controls.enabled = false;
    }
  } else if (MARKER_DEFS[currentTool]) {
    const pt = raycastMapPoint(e);
    if (pt) {
      const id = createMarker(currentTool, pt);
      undoStack.push(id);
      saveBoard();
      dragMarkerId = id; // 放置后可不松手直接拖
      controls.enabled = false;
    }
  } else if (currentTool === 'eraser') {
    const id = pickBoardItem(e);
    if (id !== null) {
      removeBoardItem(id);
      saveBoard();
    }
  }
}

function onBoardPointerMove(e) {
  // 校准模式：区域编辑拖拽 / 圈地橡皮筋预览
  if (calibMode && mapGroup) {
    if (editingRegion && (editingRegion.dragIdx >= 0 || editingRegion.dragWhole)) {
      onEditPointerMove(e);
      return;
    }
    if (calibDrawMode === 'region' && regionDrawing) {
      const pt = raycastMapPoint(e);
      if (pt) updateRegionPreview(pt);
    }
    return;
  }
  if (dragMarkerId === null && !drawing) return;
  pointerMoved = true;
  const pt = raycastMapPoint(e);
  if (!pt) return;

  if (dragMarkerId !== null) {
    const item = boardItems.get(dragMarkerId);
    if (item) item.group.position.copy(pt);
  } else if (drawing) {
    const last = drawing.points[drawing.points.length - 1];
    if (last.distanceTo(pt) > 1.2) {
      drawing.points.push(pt);
      // 实时预览
      if (drawing.line) {
        linesGroup.remove(drawing.line);
        drawing.line.geometry.dispose();
        drawing.line.material.dispose();
      }
      const lifted = drawing.points.map(p => new THREE.Vector3(p.x, p.y + 0.4, p.z));
      drawing.line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(lifted),
        new THREE.LineBasicMaterial({ color: LINE_COLOR })
      );
      linesGroup.add(drawing.line);
    }
  }
}

function onBoardPointerUp() {
  if (calibMode && editingRegion && (editingRegion.dragIdx >= 0 || editingRegion.dragWhole)) {
    onEditPointerUp();
    return;
  }
  if (dragMarkerId !== null) {
    dragMarkerId = null;
    controls.enabled = true;
    saveBoard();
  }
  if (drawing) {
    controls.enabled = true;
    if (drawing.line) {
      linesGroup.remove(drawing.line);
      drawing.line.geometry.dispose();
      drawing.line.material.dispose();
    }
    if (drawing.points.length >= 2) {
      const group = createLineObject(drawing.points);
      const id = boardSeq++;
      group.userData.itemId = id;
      linesGroup.add(group);
      boardItems.set(id, { type: 'line', group, points: drawing.points });
      undoStack.push(id);
      saveBoard();
    }
    drawing = null;
  }
}

/* 右键：校准模式下不占用（撤销顶点用 Ctrl+Z）；浏览模式删除标记/线条 */
function onBoardRightClick(e) {
  e.preventDefault();
  if (!mapGroup || calibMode) return;
  const id = pickBoardItem(e);
  if (id !== null) {
    removeBoardItem(id);
    saveBoard();
  }
}

/* ------------------------------------------------------------
 * 点位/区域标注系统：全部标注从 positions.json 读取渲染
 * 校准模式：分层取点（Tab 切层 / +/- 调高度）+ 多边形圈地
 * ---------------------------------------------------------- */
let positions = {};          // { "名称": 归一化标注对象 }
let calibMode = false;
let calibDrawMode = 'point'; // 'point' | 'region'
let calibHits = [];          // 点击命中的所有层级
let calibHitIdx = 0;
let heightAdjust = 0;
let pendingPoint = null;     // 点模式：最终取定的点
let pendingRegion = null;    // 区域模式：已闭合待保存 { points, height }
let regionDrawing = null;    // 区域模式：绘制中 { points: Vector3[] }
let editingRegion = null;    // 区域编辑中：{ name, dragIdx, dragWhole, startPt, origPoints }
const editHandles = new THREE.Group();
editHandles.name = 'region-edit-handles';
const labelGroup = new THREE.Group();
labelGroup.name = 'position-labels';
const calibPreview = new THREE.Group();
calibPreview.name = 'calib-preview';

const POINT_COLORS = {
  'A点': '#ffa940', 'B点': '#5aa9ff',
  '警家': '#7ec8ff', '匪家': '#ff7a3d',
};

function pointColor(name) { return POINT_COLORS[name] || '#ffffff'; }
const r1 = v => Math.round(v * 10) / 10;

/* 标注归一化（兼容旧格式；默认值：点标记橙色 / 区域标记半透蓝） */
function normalizeAnnotation(name, raw) {
  const type = raw.type || 'point';
  const ann = {
    type, parent: null, fontSize: null,
    color: POINT_COLORS[name] || (type === 'region' ? '#5aa9ff' : '#ffa940'),
    labelColor: '#ffffff', outlineColor: null, opacity: null,
    ...raw,
  };
  if (ann.fontSize === null) ann.fontSize = type === 'region' ? (ann.parent ? 10 : 14) : (ann.parent ? 7 : 9);
  if (ann.opacity === null) ann.opacity = type === 'region' ? 0.3 : 0.9;
  if (ann.outlineColor === null) ann.outlineColor = ann.color;
  return ann;
}

async function loadPositions() {
  try {
    const r = await fetch('/api/annotations?t=' + Date.now());
    if (r.ok) {
      const raw = await r.json();
      positions = {};
      for (const [name, ann] of Object.entries(raw)) {
        positions[name] = normalizeAnnotation(name, ann);
      }
    }
  } catch (e) {
    console.warn('[positions] 读取标注失败', e);
  }
}

async function persistPositions() {
  try {
    await fetch('/api/annotations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(positions),
    });
  } catch (e) {
    console.warn('[positions] 保存失败（需要 server.py 提供数据接口）', e);
  }
}

/* ---- JSON 备份：导出 / 导入 ---- */
function exportBackup() {
  window.open('/api/export', '_blank');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const resp = await fetch('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!resp.ok) throw new Error(await resp.text());
      await loadPositions();
      renderPositionLabels();
      alert('导入成功');
    } catch (e) {
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
}

/* 取某点的地面高度（标注贴地） */
function groundYAt(x, z, fallback) {
  boardRaycaster.set(new THREE.Vector3(x, 500, z), new THREE.Vector3(0, -1, 0));
  const hits = boardRaycaster.intersectObjects(mapGroup.children, false);
  return hits.length ? hits[0].point.y : fallback;
}

/* 射线返回所有命中层级（分层取点核心） */
function raycastMapAll(e) {
  if (!mapGroup) return [];
  setBoardPointer(e);
  return boardRaycaster.intersectObjects(mapGroup.children, false);
}

function clearLabelGroup(group) {
  while (group.children.length) {
    const c = group.children.pop();
    c.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
  }
}

/* ---- 渲染：点=实心小圆点+侧置标签；区域=半透明多边形+描边+标签 ---- */
function renderPositionLabels() {
  clearLabelGroup(labelGroup);
  if (!mapGroup) return;
  const pointEntries = Object.entries(positions).filter(([, a]) => a.type !== 'region');
  const stacks = computeLabelStacks(pointEntries);
  for (const [name, ann] of Object.entries(positions)) {
    if (ann.type === 'region') renderRegionLabel(name, ann);
    else renderPointLabel(name, ann, stacks.get(name) || 0);
  }
  refreshCalibList();
  refreshParentOptions();
}

function renderPointLabel(name, ann, stackIdx = 0) {
  const y = groundYAt(ann.x, ann.z, ann.y || 0);

  // 实心小圆点（屏幕定尺寸，精确落在标点位置）
  const dot = new THREE.Sprite(new THREE.SpriteMaterial({
    map: getDotTexture(), color: ann.color, transparent: true,
    depthTest: false, sizeAttenuation: false,
  }));
  dot.scale.set(0.018 * markerScale, 0.018 * markerScale, 1);
  dot.position.set(ann.x, y, ann.z);
  labelGroup.add(dot);

  // 名称标签显示在圆点旁边；靠近的标记按序号自动向下错开
  const sprite = createMarkerSprite(name, ann.labelColor);
  const h = 0.0045 * ann.fontSize * markerScale;
  sprite.scale.set(h * 2, h, 1);
  sprite.center.set(-0.15, 0.5 + stackIdx * 1.15); // 锚在圆点右侧，逐层下移
  sprite.position.set(ann.x, y, ann.z);
  labelGroup.add(sprite);
}

/* 相近点标记的标签自动错开：按世界距离分组，组内依次编号 */
function computeLabelStacks(pointEntries) {
  const stacks = new Map(); // name -> 序号
  const THRESH = 12;
  const groups = [];
  for (const [name, ann] of pointEntries) {
    let g = groups.find(gr => gr.some(([, a]) =>
      Math.hypot(a.x - ann.x, a.z - ann.z) < THRESH));
    if (!g) { g = []; groups.push(g); }
    g.push([name, ann]);
  }
  for (const g of groups) {
    g.sort((a, b) => a[1].z - b[1].z || a[1].x - b[1].x);
    g.forEach(([name], i) => stacks.set(name, i));
  }
  return stacks;
}

/* ------------------------------------------------------------
 * 表面贴合投影选区：
 * 圈选只存 2D 多边形顶点；XZ 平面栅格采样 + Delaunay 剖分，
 * 每个采样点用 three-mesh-bvh 向下 raycast 地面碰撞层，
 * 命中点沿法线偏移 2cm 生成贴地 BufferGeometry。
 * 陡面(normal.y<0.55)剔除；相邻点高差超阈值断开；支持 floorY 分层。
 * ---------------------------------------------------------- */
const GROUND_NORMAL_MIN = 0.55; // 陡面剔除阈值
const FLOOR_WINDOW = 4;         // 楼层过滤窗口（floorY ± 4）
const EDGE_DY_MAX = 2.5;        // 相邻采样点高差阈值（超过断开）
const REGION_GRID_STEP = 2;     // 栅格采样基础步长

const _groundRay = new THREE.Raycaster();
const _downDir = new THREE.Vector3(0, -1, 0);

function pointInPolygon(x, z, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], zi = pts[i][1], xj = pts[j][0], zj = pts[j][1];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}

/* 在 (x,z) 处向下 raycast 地面碰撞层，按 floorY 选层，沿法线偏移 2cm */
function sampleGroundPoint(x, z, floorY) {
  if (!collisionMesh) return null;
  _groundRay.set(new THREE.Vector3(x, 500, z), _downDir);
  const hits = _groundRay.intersectObject(collisionMesh, false);
  if (!hits.length) return null;
  let hit = hits[0];
  if (floorY !== undefined && floorY !== null) {
    hit = hits.find(h => Math.abs(h.point.y - floorY) <= FLOOR_WINDOW) || null;
    if (!hit) return null; // 该处不存在此楼层 → 不生成
  }
  if (hit.face && hit.face.normal.y < GROUND_NORMAL_MIN) return null;
  const n = hit.face ? hit.face.normal : new THREE.Vector3(0, 1, 0);
  return new THREE.Vector3(x + n.x * 0.02, hit.point.y + n.y * 0.02, z + n.z * 0.02);
}

/* 栅格化 + 三角剖分 + 贴地采样，高差过大自动加密或断开 */
function buildRegionGeometry(ann) {
  const pts2 = ann.points.map(p => [p[0], p[1]]);
  if (pts2.length < 3) return null;
  const floorY = ann.floorY !== undefined ? ann.floorY : null;

  let step = ann.gridStep || REGION_GRID_STEP;
  for (let attempt = 0; attempt < 2; attempt++) {
    const result = triangulateRegion(pts2, floorY, step);
    if (!result) return null;
    // 断开比例过高且还能加密 → 步长减半重试
    if (result.dropRatio > 0.3 && step > 1) { step /= 2; continue; }
    return result;
  }
  return null;
}

function triangulateRegion(pts2, floorY, step) {
  // 候选点 = 边界点 + 内部栅格点
  const candidates = [...pts2];
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  pts2.forEach(([x, z]) => {
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  });
  for (let x = minX + step / 2; x < maxX; x += step) {
    for (let z = minZ + step / 2; z < maxZ; z += step) {
      if (pointInPolygon(x, z, pts2)) candidates.push([x, z]);
    }
  }

  // 逐点 raycast 贴地（剔除陡面与不属于本楼层的点）
  const verts = [], keys = [];
  for (const [x, z] of candidates) {
    const v = sampleGroundPoint(x, z, floorY);
    if (v) { verts.push(v); keys.push([x, z]); }
  }
  if (verts.length < 3) return null;

  const delaunay = Delaunator.from(keys);
  const tris = delaunay.triangles;
  const positions = [];
  let dropped = 0, total = 0;
  const edgeOk = (a, b) => Math.abs(verts[a].y - verts[b].y) <= EDGE_DY_MAX;

  for (let i = 0; i < tris.length; i += 3) {
    const a = tris[i], b = tris[i + 1], c = tris[i + 2];
    const cx = (keys[a][0] + keys[b][0] + keys[c][0]) / 3;
    const cz = (keys[a][1] + keys[b][1] + keys[c][1]) / 3;
    if (!pointInPolygon(cx, cz, pts2)) continue;
    total++;
    if (!edgeOk(a, b) || !edgeOk(b, c) || !edgeOk(a, c)) { dropped++; continue; }
    positions.push(verts[a], verts[b], verts[c]);
  }
  if (!positions.length) return null;

  const geo = new THREE.BufferGeometry().setFromPoints(positions);
  geo.computeVertexNormals();
  const avgY = verts.reduce((s, v) => s + v.y, 0) / verts.length;
  return { geometry: geo, avgY, dropRatio: total ? dropped / total : 0 };
}

function renderRegionLabel(name, ann) {
  if (!Array.isArray(ann.points) || ann.points.length < 3) return;

  // 数据迁移：顶点统一改存 2D（投影几何在渲染时现算）
  if (ann.points.some(p => p.length > 2)) {
    ann.points = ann.points.map(p => [p[0], p[1]]);
    persistPositions();
  }
  // floorY 缺省：取首顶点命中层
  if (ann.floorY === undefined || ann.floorY === null) {
    const h = sampleGroundPoint(ann.points[0][0], ann.points[0][1], null);
    ann.floorY = h ? r1(h.y) : 0;
  }

  const built = buildRegionGeometry(ann);
  if (built) {
    const fill = new THREE.Mesh(built.geometry, new THREE.MeshBasicMaterial({
      color: new THREE.Color(ann.color),
      transparent: true, opacity: ann.opacity,
      depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2,
      side: THREE.DoubleSide,
    }));
    fill.userData.regionName = name;
    labelGroup.add(fill);
    ann.height = r1(built.avgY + 0.3);
  }

  // 描边：边界点贴地采样
  const outlinePts = [];
  for (const [x, z] of ann.points) {
    const v = sampleGroundPoint(x, z, ann.floorY);
    if (v) outlinePts.push(v.clone().setY(v.y + 0.1));
  }
  if (outlinePts.length >= 3) {
    const outline = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(outlinePts),
      new THREE.LineBasicMaterial({ color: new THREE.Color(ann.outlineColor), transparent: true, opacity: 0.95 })
    );
    outline.userData.regionName = name;
    labelGroup.add(outline);
  }

  const yLabel = ann.height !== undefined ? ann.height : 0;
  const cx = ann.points.reduce((s, p) => s + p[0], 0) / ann.points.length;
  const cz = ann.points.reduce((s, p) => s + p[1], 0) / ann.points.length;
  const sprite = createMarkerSprite(name, ann.labelColor);
  const h = 0.0045 * ann.fontSize * markerScale;
  sprite.scale.set(h * 2, h, 1);
  sprite.position.set(cx, yLabel + 2 + ann.fontSize * 0.3, cz);
  sprite.userData.regionName = name;
  labelGroup.add(sprite);
}

/* 单区域重建（编辑拖动时局部刷新用） */
function removeRegionObjects(name) {
  const objs = labelGroup.children.filter(o => o.userData.regionName === name);
  objs.forEach(o => {
    labelGroup.remove(o);
    o.traverse(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) { if (c.material.map) c.material.map.dispose(); c.material.dispose(); }
    });
  });
}

function rebuildRegionLabel(name) {
  const ann = positions[name];
  removeRegionObjects(name);
  if (ann && ann.type === 'region') renderRegionLabel(name, ann);
}

/* ---- 校准模式 ---- */
/* 模式化鼠标输入：
 * 校准模式：左键只标点/放顶点；Alt+左键旋转；中键或空格+左键平移；滚轮缩放
 * 浏览模式：OrbitControls 默认（左键旋转 / 右键平移 / 滚轮缩放）
 */
const MOUSE_BROWSE = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
const MOUSE_CALIB = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: null };
let altHeld = false;
let spaceHeld = false;

function applyCalibMouseButtons() {
  if (!calibMode) {
    controls.mouseButtons = { ...MOUSE_BROWSE };
    return;
  }
  const m = { ...MOUSE_CALIB };
  if (spaceHeld) m.LEFT = THREE.MOUSE.PAN;
  else if (altHeld) m.LEFT = THREE.MOUSE.ROTATE;
  controls.mouseButtons = m;
}

function setCalibMode(on) {
  calibMode = on;
  document.body.classList.toggle('calib', on);
  document.getElementById('btn-calib').textContent = on ? '✔ 完成校准' : '🎯 标点校准';
  document.getElementById('mode-badge').textContent = on
    ? '🎯 校准模式：左键标点 · Alt+左键旋转 · 中键平移（Q 返回浏览）'
    : '👁 浏览模式（Q 切换校准）';
  applyCalibMouseButtons();
  if (on) {
    setTopView(); // 校准在正俯视图下进行
    refreshCalibList();
    refreshParentOptions();
  } else {
    stopRegionEdit();
    cancelRegionDrawing();
    clearLabelGroup(calibPreview);
  }
}

function setCalibDrawMode(mode) {
  calibDrawMode = mode;
  document.getElementById('calib-mode-point').classList.toggle('active', mode === 'point');
  document.getElementById('calib-mode-region').classList.toggle('active', mode === 'region');
  stopRegionEdit();
  cancelRegionDrawing();
  clearLabelGroup(calibPreview);
  document.getElementById('calib-coords').textContent =
    mode === 'point' ? '坐标：点击地图取点' : '区域：连续点击放顶点';
}

function updateCalibCoords(pt) {
  document.getElementById('calib-coords').textContent =
    `坐标：x=${pt.x.toFixed(1)}  y=${pt.y.toFixed(1)}  z=${pt.z.toFixed(1)}`;
}

function updateCalibLayerInfo() {
  const el = document.getElementById('calib-layer');
  el.textContent = calibHits.length > 1
    ? `命中 ${calibHits.length} 层 第 ${calibHitIdx + 1}/${calibHits.length} 层（Tab 切换）`
    : (calibHits.length === 1 ? '命中 1 层' : '');
}

/* 选定第 idx 层 */
function selectCalibHit(idx) {
  if (!calibHits.length) return;
  calibHitIdx = ((idx % calibHits.length) + calibHits.length) % calibHits.length;
  heightAdjust = 0;
  pendingPoint = calibHits[calibHitIdx].point.clone();
  document.getElementById('calib-height').textContent = '高度微调 0';
  updateCalibCoords(pendingPoint);
  updateCalibLayerInfo();
  updateCalibPreviewPoint();
}

/* +/- 微调高度 */
function adjustCalibHeight(delta) {
  if (!pendingPoint) return;
  heightAdjust += delta;
  pendingPoint.y += delta;
  document.getElementById('calib-height').textContent =
    `高度微调 ${heightAdjust >= 0 ? '+' : ''}${heightAdjust.toFixed(1)}`;
  updateCalibCoords(pendingPoint);
  updateCalibPreviewPoint();
}

/* 取点预览（小圆环跟随选中点） */
function updateCalibPreviewPoint() {
  clearLabelGroup(calibPreview);
  if (!pendingPoint || calibDrawMode !== 'point') return;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.8, 2.6, 24),
    new THREE.MeshBasicMaterial({ color: 0xffe082, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(pendingPoint).y += 0.3;
  calibPreview.add(ring);
}

/* ---- 区域编辑：拖顶点 / 边中加点 / Ctrl+点删点 / 拖填充整体移动 / Esc 完成 ---- */
function startRegionEdit(name) {
  if (editingRegion && editingRegion.name === name) { stopRegionEdit(); return; }
  cancelRegionDrawing();
  clearLabelGroup(calibPreview);
  editingRegion = { name, dragIdx: -1, dragWhole: false, startPt: null, origPoints: null };
  updateEditHandles();
  document.getElementById('calib-coords').textContent =
    `编辑「${name}」：拖顶点 / 拖边中白点加顶点 / Ctrl+点删顶点 / 拖填充整体移动 / Esc 完成`;
}

function stopRegionEdit() {
  editingRegion = null;
  clearLabelGroup(editHandles);
}

function updateEditHandles() {
  clearLabelGroup(editHandles);
  if (!editingRegion) return;
  const ann = positions[editingRegion.name];
  if (!ann || ann.type !== 'region') { editingRegion = null; return; }
  const y = (ann.height || 0) + 0.6;
  ann.points.forEach(([x, z], i) => {
    const h = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffe082, depthTest: false })
    );
    h.position.set(x, y, z);
    h.userData = { handle: 'vertex', idx: i };
    editHandles.add(h);

    const [x2, z2] = ann.points[(i + 1) % ann.points.length];
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthTest: false })
    );
    m.position.set((x + x2) / 2, y, (z + z2) / 2);
    m.userData = { handle: 'mid', idx: i };
    editHandles.add(m);
  });
}

function updateEditingRegionHeight(ann) {
  // 标签/手柄参考高度：顶点地面高度均值（渲染时投影会重算真实贴地网格）
  ann.height = r1(ann.points.reduce((s, p) => s + groundYAt(p[0], p[1], 0) + 0.05, 0) / ann.points.length + 0.3);
}

function onEditPointerDown(e) {
  const ann = positions[editingRegion.name];
  if (!ann) { stopRegionEdit(); return; }
  setBoardPointer(e);

  // 1) 顶点/边中手柄
  const hits = boardRaycaster.intersectObjects(editHandles.children, false);
  if (hits.length) {
    const h = hits[0].object.userData;
    if (h.handle === 'vertex') {
      if ((e.ctrlKey || e.metaKey) && ann.points.length > 3) {
        ann.points.splice(h.idx, 1); // Ctrl+点：删顶点（保底 3 个）
        updateEditingRegionHeight(ann);
        persistPositions();
        rebuildRegionLabel(editingRegion.name);
        updateEditHandles();
        return;
      }
      editingRegion.dragIdx = h.idx;
    } else {
      // 边中点：插入新顶点（2D）并立即拖拽它
      const pt = hits[0].point;
      ann.points.splice(h.idx + 1, 0, [r1(pt.x), r1(pt.z)]);
      editingRegion.dragIdx = h.idx + 1;
    }
    controls.enabled = false;
    return;
  }

  // 2) 填充面：整体移动
  const fillHits = boardRaycaster.intersectObjects(
    labelGroup.children.filter(o => o.userData.regionName === editingRegion.name), true);
  if (fillHits.length) {
    editingRegion.dragWhole = true;
    editingRegion.startPt = fillHits[0].point.clone();
    editingRegion.origPoints = ann.points.map(p => [...p]);
    controls.enabled = false;
  }
}

function onEditPointerMove(e) {
  const ann = positions[editingRegion.name];
  if (!ann) return;
  const pt = raycastMapPoint(e);
  if (!pt) return;
  if (editingRegion.dragIdx >= 0) {
    // 顶点拖拽：只改 2D 坐标，贴地投影在渲染时重算
    ann.points[editingRegion.dragIdx] = [r1(pt.x), r1(pt.z)];
  } else if (editingRegion.dragWhole) {
    const dx = pt.x - editingRegion.startPt.x;
    const dz = pt.z - editingRegion.startPt.z;
    ann.points = editingRegion.origPoints.map(p => [r1(p[0] + dx), r1(p[1] + dz)]);
  } else {
    return;
  }
  updateEditingRegionHeight(ann);
  rebuildRegionLabel(editingRegion.name);
  updateEditHandles();
}

async function onEditPointerUp() {
  editingRegion.dragIdx = -1;
  editingRegion.dragWhole = false;
  controls.enabled = true;
  const ann = positions[editingRegion.name];
  if (ann) updateEditingRegionHeight(ann);
  await persistPositions();
  rebuildRegionLabel(editingRegion.name);
  updateEditHandles();
  refreshCalibList();
}
function addRegionVertex(pt) {
  if (!regionDrawing) regionDrawing = { points: [] };
  // 点击起点附近闭合
  if (regionDrawing.points.length >= 3 && pt.distanceTo(regionDrawing.points[0]) < 3) {
    closeRegionDrawing();
    return;
  }
  regionDrawing.points.push(pt.clone());
  updateRegionPreview();
}

function undoRegionVertex() {
  if (!regionDrawing) return;
  regionDrawing.points.pop();
  if (!regionDrawing.points.length) regionDrawing = null;
  updateRegionPreview();
}

function cancelRegionDrawing() {
  regionDrawing = null;
  pendingRegion = null;
  updateRegionPreview();
}

function closeRegionDrawing() {
  if (!regionDrawing || regionDrawing.points.length < 3) return;
  const pts = regionDrawing.points;
  // 圈选只存 2D 多边形顶点 + 首顶点楼层高度（投影贴地在渲染时现算）
  pendingRegion = {
    points: pts.map(p => [r1(p.x), r1(p.z)]),
    floorY: r1(pts[0].y),
    height: r1(pts[0].y + 0.3),
  };
  regionDrawing = null;
  updateRegionPreview();
  document.getElementById('calib-coords').textContent = '区域已闭合：输入名称后保存';
}

/* 区域绘制实时预览：顶点圆点 + 连线 + 半透明填充 */
function updateRegionPreview(hoverPt) {
  clearLabelGroup(calibPreview);
  const src = pendingRegion
    ? pendingRegion.points.map(([x, z]) => new THREE.Vector3(x, pendingRegion.height, z))
    : (regionDrawing ? regionDrawing.points : []);
  if (!src.length) return;
  const pts = src.concat(hoverPt && regionDrawing ? [hoverPt] : []);
  const color = 0xffe082;

  pts.forEach(p => {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 10, 10),
      new THREE.MeshBasicMaterial({ color, depthWrite: false })
    );
    dot.position.copy(p).y += 0.4;
    calibPreview.add(dot);
  });

  if (pts.length >= 2) {
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts.map(p => p.clone().setY(p.y + 0.4))),
      new THREE.LineBasicMaterial({ color })
    );
    calibPreview.add(line);
  }

  if (pts.length >= 3) {
    const shape = new THREE.Shape();
    pts.forEach((p, i) => (i === 0 ? shape.moveTo(p.x, -p.z) : shape.lineTo(p.x, -p.z)));
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(-Math.PI / 2);
    const yAvg = pts.reduce((s, p) => s + p.y, 0) / pts.length + 0.3;
    const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false,
    }));
    fill.position.y = yAvg;
    calibPreview.add(fill);
  }
}

/* ---- 保存 ---- */
async function saveCalibPoint() {
  const name = document.getElementById('calib-name').value.trim();
  if (!name) { document.getElementById('calib-name').focus(); return; }
  const parent = document.getElementById('calib-parent').value || null;

  if (calibDrawMode === 'region') {
    if (!pendingRegion) {
      document.getElementById('calib-coords').textContent = '请先圈出区域（回车或点击起点闭合）';
      return;
    }
    positions[name] = normalizeAnnotation(name, {
      type: 'region', points: pendingRegion.points,
      floorY: pendingRegion.floorY, height: pendingRegion.height, parent,
    });
    pendingRegion = null;
    clearLabelGroup(calibPreview);
  } else {
    if (!pendingPoint) {
      document.getElementById('calib-coords').textContent = '坐标：请先在地图上点击取点';
      return;
    }
    positions[name] = normalizeAnnotation(name, {
      type: 'point', x: r1(pendingPoint.x), y: r1(pendingPoint.y), z: r1(pendingPoint.z), parent,
    });
  }
  document.getElementById('calib-name').value = '';
  await persistPositions();
  renderPositionLabels();
}

/* ---- 标注列表（含逐标注样式编辑：取色器/透明度） ---- */
function refreshCalibList() {
  const el = document.getElementById('calib-list');
  if (!el) return;
  el.innerHTML = '';
  for (const [name, ann] of Object.entries(positions)) {
    const row = document.createElement('div');
    row.className = 'calib-item';
    const typeTag = ann.type === 'region' ? '区域' : '点';
    const detail = ann.type === 'region' ? `${ann.points.length}顶点` : `(${ann.x}, ${ann.y}, ${ann.z})`;
    row.innerHTML = `<span class="tb-dot" style="background:${ann.color}"></span>` +
      `<span class="calib-name" style="cursor:pointer" title="点击展开样式编辑">${name}</span>` +
      `<span class="calib-type">${typeTag}${ann.parent ? '·子' : ''}</span>` +
      `<span class="calib-xyz">${detail}</span>`;

    const fm = document.createElement('button');
    fm.className = 'calib-font-btn';
    fm.textContent = 'A-';
    fm.addEventListener('click', () => adjustAnnotationFont(name, -1));
    const fp = document.createElement('button');
    fp.className = 'calib-font-btn';
    fp.textContent = 'A+';
    fp.addEventListener('click', () => adjustAnnotationFont(name, 1));
    const del = document.createElement('button');
    del.textContent = '×';
    del.addEventListener('click', async () => {
      delete positions[name];
      await persistPositions();
      renderPositionLabels();
    });
    row.append(fm, fp);
    if (ann.type === 'region') {
      const ed = document.createElement('button');
      ed.className = 'calib-font-btn';
      ed.textContent = '✎';
      ed.title = '编辑区域（拖顶点/加删顶点/整体移动）';
      ed.addEventListener('click', () => startRegionEdit(name));
      row.appendChild(ed);
    }
    row.appendChild(del);
    el.appendChild(row);

    // 点击名称展开/收起样式编辑器
    const editor = buildStyleEditor(name, ann);
    editor.style.display = 'none';
    row.querySelector('.calib-name').addEventListener('click', () => {
      editor.style.display = editor.style.display === 'none' ? 'block' : 'none';
    });
    el.appendChild(editor);
  }
}

/* 每个标注的样式编辑器（点：圆点/标签颜色；区域：填充/透明度/描边/标签颜色） */
function buildStyleEditor(name, ann) {
  const box = document.createElement('div');
  box.className = 'calib-style-editor';

  const addColor = (label, key) => {
    const wrap = document.createElement('label');
    wrap.className = 'style-field';
    const input = document.createElement('input');
    input.type = 'color';
    input.value = ann[key];
    input.addEventListener('input', async () => {
      ann[key] = input.value;
      row0Dot();
      await persistPositions();
      renderPositionLabels();
    });
    wrap.append(input, document.createTextNode(label));
    box.appendChild(wrap);
  };
  const row0Dot = () => {}; // 占位（列表小圆点下次刷新时同步）

  if (ann.type === 'region') {
    addColor('填充', 'color');
    const wrap = document.createElement('label');
    wrap.className = 'style-field';
    const range = document.createElement('input');
    range.type = 'range';
    range.min = '0.05'; range.max = '1'; range.step = '0.05';
    range.value = String(ann.opacity);
    const val = document.createElement('span');
    val.textContent = Number(ann.opacity).toFixed(2);
    range.addEventListener('input', async () => {
      ann.opacity = parseFloat(range.value);
      val.textContent = ann.opacity.toFixed(2);
      await persistPositions();
      renderPositionLabels();
    });
    wrap.append(document.createTextNode('透明度'), range, val);
    box.appendChild(wrap);
    addColor('描边', 'outlineColor');
    addColor('标签', 'labelColor');

    // 楼层 Y（上下层区域的分层选择：只投影到该高度层）
    const fw = document.createElement('label');
    fw.className = 'style-field';
    const fy = document.createElement('input');
    fy.type = 'number';
    fy.step = '1';
    fy.value = String(ann.floorY ?? 0);
    fy.title = '只在该高度层生成选区（上下层同屏时用它选层）';
    fy.addEventListener('change', async () => {
      ann.floorY = parseFloat(fy.value) || 0;
      await persistPositions();
      renderPositionLabels();
    });
    fw.append(document.createTextNode('楼层Y'), fy);
    box.appendChild(fw);
  } else {
    addColor('圆点', 'color');
    addColor('标签', 'labelColor');
  }
  return box;
}

async function adjustAnnotationFont(name, delta) {
  const ann = positions[name];
  if (!ann) return;
  ann.fontSize = Math.max(4, ann.fontSize + delta);
  await persistPositions();
  renderPositionLabels();
}

/* 父级下拉：所有已有标注都可作为父级 */
function refreshParentOptions() {
  const sel = document.getElementById('calib-parent');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">无父级</option>';
  for (const name of Object.keys(positions)) {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  }
  sel.value = cur;
}

function initCalib() {
  scene.add(labelGroup, calibPreview, editHandles);
  document.getElementById('btn-calib').addEventListener('click', () => setCalibMode(!calibMode));
  document.getElementById('calib-mode-point').addEventListener('click', () => setCalibDrawMode('point'));
  document.getElementById('calib-mode-region').addEventListener('click', () => setCalibDrawMode('region'));
  document.getElementById('calib-save').addEventListener('click', saveCalibPoint);
  document.getElementById('calib-hminus').addEventListener('click', () => adjustCalibHeight(-0.5));
  document.getElementById('calib-hplus').addEventListener('click', () => adjustCalibHeight(0.5));
  document.getElementById('calib-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') saveCalibPoint();
    e.stopPropagation();
  });
  document.getElementById('calib-export').addEventListener('click', exportBackup);
  document.getElementById('calib-import').addEventListener('click', () => {
    document.getElementById('calib-import-file').click();
  });
  document.getElementById('calib-import-file').addEventListener('change', e => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  });
  window.addEventListener('keydown', e => {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
      if (e.code === 'KeyQ') { setCalibMode(!calibMode); return; }
      if (e.code === 'AltLeft' || e.code === 'AltRight') { altHeld = true; applyCalibMouseButtons(); }
      if (e.code === 'Space') {
        if (calibMode) e.preventDefault();
        spaceHeld = true;
        applyCalibMouseButtons();
      }
    }
    if (!calibMode || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Tab') {
      e.preventDefault();
      if (calibDrawMode === 'point' && calibHits.length > 1) {
        selectCalibHit(calibHitIdx + (e.shiftKey ? -1 : 1));
      }
    } else if (e.code === 'Escape') {
      if (editingRegion) {
        stopRegionEdit();
        document.getElementById('calib-coords').textContent = '已退出区域编辑';
      } else {
        cancelRegionDrawing();
        document.getElementById('calib-coords').textContent = '区域：连续点击放顶点';
      }
    } else if (e.code === 'Enter') {
      closeRegionDrawing();
    } else if (e.code === 'Equal' || e.code === 'NumpadAdd') {
      adjustCalibHeight(0.5);
    } else if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
      adjustCalibHeight(-0.5);
    } else if (e.code === 'KeyZ' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      undoRegionVertex(); // 校准模式下 Ctrl+Z 撤销顶点
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'AltLeft' || e.code === 'AltRight') { altHeld = false; applyCalibMouseButtons(); }
    if (e.code === 'Space') { spaceHeld = false; applyCalibMouseButtons(); }
  });
  window.addEventListener('blur', () => {
    altHeld = false;
    spaceHeld = false;
    applyCalibMouseButtons();
  });
}

/* 启动（所有 const 声明就绪后再初始化，避免 TDZ 错误） */
init();
</script>
